kind = "mobile"
previewPath = "/devotion-mobile/"
title = "DevOtion Mobile"
version = "1.0.0"
id = "artifacts/devotion-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/devotion-mobile/" ]
localPort = 21097

[services.development]
run = "pnpm --filter @workspace/devotion-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devotion-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/devotion-mobile", "run", "serve" ]

[services.env]
PORT = "21097"
BASE_PATH = "/devotion-mobile/"
